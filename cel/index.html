let lightbox = null;

function openPhotoSwipe(dataArray, startIndex) {
const dataSource = dataArray.map(item => ({
src: item.url,
msrc: item.thumb,
w: item.w || 1920,
h: item.h || 1080,
description: item.description || item.title
}));

if (lightbox) {
lightbox.destroy();
}

lightbox = new PhotoSwipeLightbox({
dataSource: dataSource,
pswpModule: PhotoSwipe,
thumbEl: () => null,
showHideAnimationType: 'none',
imageClickAction: 'close',
tapAction: 'close',
doubleTapAction: 'close',
paddingFn: (viewportSize) => {
return {
top: Math.round(viewportSize.y * 0.15),
bottom: Math.round(viewportSize.y * 0.15),
left: Math.round(viewportSize.x * 0.15),
right: Math.round(viewportSize.x * 0.15)
};
}
});

lightbox.on('uiRegister', function() {
lightbox.pswp.ui.registerElement({
name: 'custom-caption',
order: 9,
isButton: false,
appendTo: 'root',
html: '',
onInit: (el, pswp) => {
el.className = 'pswp__custom-caption';
pswp.on('change', () => {
const currSlide = pswp.currSlide;
if (currSlide && currSlide.data.description) {
el.innerHTML = currSlide.data.description;
el.style.display = 'block';
} else {
el.style.display = 'none';
}
});
}
});
});

lightbox.init();
lightbox.loadAndOpen(startIndex);
}

function switchCelTab(evt, tabId) {
const contents = document.querySelectorAll('.cels-content');
contents.forEach(content => content.classList.remove('active'));

const btns = document.querySelectorAll('.cels-tab-btn');
btns.forEach(btn => btn.classList.remove('active'));

document.getElementById(tabId).classList.add('active');
// GIF 体积大，切到该标签时才开始加载
document.querySelectorAll('#' + tabId + ' img[data-gif]').forEach(img => { if (!img.src) img.src = img.dataset.gif; });
evt.currentTarget.classList.add('active');
}

function toggleCelBlock(cardElem, setId) {
const existingBlock = document.getElementById('active-cels-block');

if (existingBlock && existingBlock.dataset.from === setId) {
existingBlock.remove();
return;
}

if (existingBlock) existingBlock.remove();

const block = document.createElement('div');
block.id = 'active-cels-block';
block.className = 'cels-expand-block';
block.dataset.from = setId;

const subGrid = document.createElement('div');
subGrid.className = 'cels-sub-grid';

const items = staticDataSets[setId];

items.forEach((item, index) => {
const subCard = document.createElement('div');
subCard.className = 'cels-sub-card';
subCard.onclick = () => openPhotoSwipe(items, index);

const imgObj = document.createElement('img');
imgObj.alt = item.title;
imgObj.src = item.thumb || item.url;
imgObj.setAttribute('data-no-lazy', 'true');

subCard.appendChild(imgObj);

const pElem = document.createElement('p');
pElem.innerText = item.title;
subCard.appendChild(pElem);

subGrid.appendChild(subCard);
});

block.appendChild(subGrid);

const parentGrid = cardElem.parentElement;
const cards = Array.from(parentGrid.querySelectorAll('.cels-card'));
const cardIndex = cards.indexOf(cardElem);

const columns = window.innerWidth <= 768 ? 2 : 4;
const rowIndex = Math.floor(cardIndex / columns);
const insertAfterIndex = Math.min((rowIndex + 1) * columns - 1, cards.length - 1);

cards[insertAfterIndex].after(block);
}
