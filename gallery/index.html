    // 宽高已写在数据里（w/h），不再预下载原图；新增图片时记得补上 w、h

    // 2. 渲染 DOM 卡片
    const container = document.getElementById('gallery-container');
    container.innerHTML = imageData.map((item, index) => `
        <div class="gallery-card" data-category="${item.category}" data-index="${index}">
            <img src="${item.thumb || item.url}" alt="${item.title}" class="gallery-img" loading="lazy" decoding="async" lazyload="false" />
            <span class="gallery-caption">${item.title}</span>
        </div>
    `).join('');

    // 3. Tab 筛选逻辑
    const tabBtns = document.querySelectorAll('.tab-btn');
    const galleryCards = document.querySelectorAll('.gallery-card');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.getAttribute('data-filter');

            galleryCards.forEach(card => {
                const category = card.getAttribute('data-category');
                if (filter === 'all' || category === filter) {
                    card.classList.remove('hide');
                } else {
                    card.classList.add('hide');
                }
            });
        });
    });

    // 4. 手动调起 PhotoSwipe
    let lightbox = null;

    function openPhotoSwipe(startIndex) {
        const visibleCards = Array.from(document.querySelectorAll('.gallery-card:not(.hide)'));
        const dataSource = visibleCards.map(card => {
            const idx = parseInt(card.getAttribute('data-index'), 10);
            const data = imageData[idx];
            return {
                src: data.url,
                msrc: data.thumb,
                w: data.w || 1920,
                h: data.h || 1080,
                description: data.description || data.title
            };
        });

        const activeCard = document.querySelector(`.gallery-card[data-index="${startIndex}"]`);
        const pswpIndex = visibleCards.indexOf(activeCard);

        if (lightbox) {
            lightbox.destroy();
        }

        lightbox = new PhotoSwipeLightbox({
            dataSource: dataSource,
            pswpModule: PhotoSwipe,
            thumbEl: () => null,
            imageClickAction: 'close',
            tapAction: 'close',
            doubleTapAction: 'close',

            paddingFn: (viewportSize) => {
                return {
                    top: viewportSize.y * 0.08,
                    bottom: viewportSize.y * 0.12,
                    left: viewportSize.x * 0.08,
                    right: viewportSize.x * 0.08
                };
            }
        });

        // 注册独立描述控件
        lightbox.on('uiRegister', function() {
            lightbox.pswp.ui.registerElement({
                name: 'custom-caption',
                order: 9,
                isButton: false,
                appendTo: 'root',
                html: '',
                onInit: (el, pswp) => {
                    el.className = 'pswp__custom-caption';
                    pswp.on('change', () => {
                        const currSlide = pswp.currSlide;
                        if (currSlide && currSlide.data.description) {
                            el.innerHTML = currSlide.data.description;
                            el.style.display = 'block';
                        } else {
                            el.style.display = 'none';
                        }
                    });
                }
            });
        });

        // 监听打开/关闭状态，控制 navbar 的 z-index 避免遮挡
        lightbox.on('open', () => {
            document.body.classList.add('pswp-open');
        });
        lightbox.on('close', () => {
            document.body.classList.remove('pswp-open');
        });

        lightbox.init();
        lightbox.loadAndOpen(pswpIndex >= 0 ? pswpIndex : 0);
    }

    // 绑定卡片点击
    container.addEventListener('click', (e) => {
        const card = e.target.closest('.gallery-card');
        if (card) {
            const index = parseInt(card.getAttribute('data-index'), 10);
            openPhotoSwipe(index);
        }
    });
</script>
